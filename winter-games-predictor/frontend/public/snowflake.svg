<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="iceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g fill="url(#iceGradient)" stroke="url(#iceGradient)" stroke-width="2" stroke-linecap="round">
    <!-- Main vertical line -->
    <line x1="50" y1="10" x2="50" y2="90"/>
    <!-- Main horizontal line -->
    <line x1="10" y1="50" x2="90" y2="50"/>
    <!-- Diagonal lines -->
    <line x1="21.72" y1="21.72" x2="78.28" y2="78.28"/>
    <line x1="78.28" y1="21.72" x2="21.72" y2="78.28"/>
    <!-- Top branches -->
    <line x1="50" y1="25" x2="40" y2="15"/>
    <line x1="50" y1="25" x2="60" y2="15"/>
    <!-- Bottom branches -->
    <line x1="50" y1="75" x2="40" y2="85"/>
    <line x1="50" y1="75" x2="60" y2="85"/>
    <!-- Left branches -->
    <line x1="25" y1="50" x2="15" y2="40"/>
    <line x1="25" y1="50" x2="15" y2="60"/>
    <!-- Right branches -->
    <line x1="75" y1="50" x2="85" y2="40"/>
    <line x1="75" y1="50" x2="85" y2="60"/>
    <!-- Diagonal branches -->
    <line x1="35" y1="35" x2="25" y2="30"/>
    <line x1="35" y1="35" x2="30" y2="25"/>
    <line x1="65" y1="35" x2="75" y2="30"/>
    <line x1="65" y1="35" x2="70" y2="25"/>
    <line x1="35" y1="65" x2="25" y2="70"/>
    <line x1="35" y1="65" x2="30" y2="75"/>
    <line x1="65" y1="65" x2="75" y2="70"/>
    <line x1="65" y1="65" x2="70" y2="75"/>
    <!-- Center circle -->
    <circle cx="50" cy="50" r="5" fill="url(#iceGradient)"/>
  </g>
</svg>
