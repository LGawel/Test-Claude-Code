<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziekquiz Leaderboard</title>
    <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
    <div class="container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>🎵 Muziekquiz Leaderboard 🎵</h1>
            <div class="round-indicator">
                Ronde <span id="current-round">1</span> / <span id="total-rounds">5</span>
            </div>
        </header>

        <!-- Race track met rijbanen -->
        <div class="race-section">

            <!-- Start kolom -->
            <div class="start-col">
                <span>START</span>
            </div>

            <!-- Rijbanen (dynamisch gevuld via JS) -->
            <div class="lanes-container" id="lanes-container">
                <div class="waiting-text">Wachten op teams...</div>
            </div>

            <!-- Finish kolom -->
            <div class="finish-col">
                <span>FINISH</span>
                <div class="checkered-flag"></div>
            </div>

        </div>

    </div>

    <!-- Confetti + vuurwerk container -->
    <div class="confetti-container" id="confetti-container"></div>

    <!-- Winner overlay -->
    <div class="winner-overlay" id="winner-overlay">
        <div class="winner-content">
            <h2>🏆 WINNAAR! 🏆</h2>
            <div class="winner-team" id="winner-team"></div>
            <div class="winner-score" id="winner-score"></div>
        </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>
